name: ansight_flutter_desktop_harness
description: Ansight Flutter macOS integration and recording harness.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  ansight_flutter:
    path: ../../ansight-sdk/src/flutter
  ansight_example:
    path: ../../ansight-sdk/src/flutter/example

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
