name: SDKLessNotes
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SYMROOT: $(PROJECT_DIR)/../build/ios/Build/Products
    OBJROOT: $(PROJECT_DIR)/../build/ios/Build/Intermediates.noindex
targets:
  SDKLessNotes:
    type: application
    platform: iOS
    sources: [SDKLessNotes]
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ansight.testapps.sdklessnotes
        PRODUCT_NAME: SDKLessNotes
        SWIFT_VERSION: "5.0"
        SUPPORTED_PLATFORMS: iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Notes Harness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: [SDKLessNotesUITests]
  SDKLessNotesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SDKLessNotesUITests]
    dependencies:
      - target: SDKLessNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ansight.testapps.sdklessnotes.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
