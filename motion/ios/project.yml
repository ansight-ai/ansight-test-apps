name: MotionHarness
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  AnsightSDK:
    path: ../../../ansight/ansight-sdk/src/ios
targets:
  MotionHarness:
    type: application
    platform: iOS
    sources: [MotionHarness]
    dependencies:
      - package: AnsightSDK
        product: Ansight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ansight.testapps.motionharness
        PRODUCT_NAME: MotionHarness
        SWIFT_VERSION: "5.0"
        SUPPORTED_PLATFORMS: iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Motion Harness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
