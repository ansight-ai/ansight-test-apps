name: PencilReactNative
options:
  deploymentTarget:
    iOS: '17.5'
settings:
  base:
    SWIFT_VERSION: '5.9'
    PRODUCT_BUNDLE_IDENTIFIER: ai.ansight.pencil.reactnative
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  PencilReactNative:
    type: application
    platform: iOS
    sources:
      - PencilReactNative
      - path: main.jsbundle
        buildPhase: resources
