schemaVersion: 1
id: "annotation.live-roundtrip"
name: "iOS native annotation roundtrip"
appId: "ai.ansight.ios.native-harness"
prompt: >-
  Use the connected Debug iOS native harness. On the Home dashboard, scroll to the top and tap
  the Annotate quick action with accessibility identifier annotation.present. Verify that the
  native editor opens over a captured screen. Draw a visible freehand stroke in the middle of
  the image, enter the exact overall feedback text 'annotation e2e ios roundtrip', and tap Save.
  After Save, scroll to the top of Home and read the annotation.result label directly below the
  Annotate quick action. Wait for it to show a completed annotation result and an ID. Do not
  create or edit a host annotation directly; the record must come from the app's
  Annotate.PresentAsync flow.
validation:
  prompt: >-
    Use the visible app editor and returned harness status as evidence. The companion verification
    script checks host persistence in the same session.
  assertions:
    - "The app opened the native annotation editor from its Annotate control."
    - "A visible freehand stroke and exact feedback text were entered before Save."
    - "After Save, the annotation.result label showed a completed annotation result with an annotation ID."
